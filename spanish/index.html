<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f7f4ee">
<title>Lecturas diarias de Noam</title>
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#f7f4ee;color:#1d1d1f;font:20px/1.7 Georgia,"Iowan Old Style","Times New Roman",serif}
main{max-width:38rem;margin:0 auto;padding:1.5rem 1.25rem 3rem}
header h1{font:700 1.6rem/1.25 system-ui,-apple-system,"Segoe UI",sans-serif;margin:.5rem 0 .4rem;color:#1f3a5f}
.note{font:.85rem/1.5 system-ui,-apple-system,sans-serif;color:#4a4a4a;background:#ece6da;border-radius:10px;padding:.75rem 1rem;margin:0 0 1.5rem}
.post{background:#fff;border-radius:14px;padding:1.4rem 1.25rem;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:1.5rem}
.badge{display:inline-block;font:600 .75rem/1 system-ui,sans-serif;letter-spacing:.02em;background:#dbe7f3;color:#1f3a5f;border-radius:999px;padding:.4rem .75rem}
.date{font:.85rem/1.4 system-ui,sans-serif;color:#555;margin:.6rem 0 .2rem}
.post h2{font:700 1.35rem/1.3 system-ui,-apple-system,sans-serif;margin:.3rem 0 1rem;color:#1d1d1f}
.post p{margin:0 0 1.1rem}
h3{font:700 .95rem/1.3 system-ui,sans-serif;color:#1f3a5f;margin:1.5rem 0 .6rem;text-transform:uppercase;letter-spacing:.04em}
.gl{list-style:none;padding:0;margin:0}
.gl li{padding:.6rem 0;border-bottom:1px solid #eee}
.gl li:last-child{border-bottom:0}
.gl b{display:block;color:#1d1d1f}
.gl span{display:block;font:.85rem/1.4 system-ui,sans-serif;color:#555}
.src{font:.85rem/1.5 system-ui,sans-serif;color:#555;margin-top:1.2rem;padding-top:.8rem;border-top:1px solid #eee}
.src a{color:#1f5fa8;word-break:break-word}
.arch h2{font:700 1.15rem/1.3 system-ui,sans-serif;color:#1f3a5f;margin:2rem 0 .8rem}
details{background:#fff;border-radius:14px;margin-bottom:.8rem;box-shadow:0 1px 3px rgba(0,0,0,.08)}
summary{cursor:pointer;min-height:56px;padding:1rem 1.25rem;font:600 .95rem/1.4 system-ui,sans-serif;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";float:right;color:#1f3a5f}
details[open] summary::after{content:"－"}
summary small{display:block;font-weight:400;color:#555}
details .post{box-shadow:none;margin:0;padding-top:0}
</style>
</head>
<body>
<main>
  <header>
    <h1>Lecturas diarias de Noam</h1>
    <p class="note">Se actualiza todos los días alrededor de las 4 de la tarde (hora de Melbourne). La lectura más nueva está arriba; las anteriores, en el archivo.</p>
  </header>
  <div id="latest"><p>Cargando…</p></div>
  <section class="arch" id="archwrap" hidden><h2>Archivo</h2><div id="archive"></div></section>
</main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const body = (p, head) => (head ? `<span class="badge">${esc(p.topic)}</span><div class="date">${esc(p.date)}</div><h2>${esc(p.title)}</h2>` : "")
  + (p.paragraphs||[]).map(t => `<p>${esc(t)}</p>`).join("")
  + ((p.glossary||[]).length ? `<h3>Glosario</h3><ul class="gl">` + p.glossary.map(g => `<li><b>${esc(g.es)}</b><span>${esc(g.en)}</span></li>`).join("") + `</ul>` : "")
  + (p.source ? `<p class="src">Fuente: <a href="${esc(p.source.url)}" target="_blank" rel="noopener">${esc(p.source.name)}</a></p>` : "");
fetch("posts.json?v=" + Date.now(), {cache: "no-store"}).then(r => r.json()).then(posts => {
  const [latest, ...older] = posts;
  document.getElementById("latest").innerHTML = latest ? `<article class="post">${body(latest, true)}</article>` : "<p>Todavía no hay lecturas.</p>";
  if (older.length) {
    document.getElementById("archwrap").hidden = false;
    document.getElementById("archive").innerHTML = older.map(p =>
      `<details><summary><span class="badge">${esc(p.topic)}</span> ${esc(p.title)}<small>${esc(p.date)}</small></summary><article class="post">${body(p, false)}</article></details>`).join("");
  }
}).catch(e => { console.error(e); document.getElementById("latest").innerHTML = "<p>No se pudieron cargar las lecturas. Intenta más tarde.</p>"; });
</script>
</body>
</html>
