<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4efe3">
<title>El Diario de Noam — Lecturas diarias</title>
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#f4efe3;color:#1a1a1a;font:20px/1.7 Georgia,"Iowan Old Style","Times New Roman",serif}
main{max-width:38rem;margin:0 auto;padding:1.25rem 1.1rem 3rem}
@media (min-width:900px){main{max-width:68rem}}
.mast{text-align:center;padding:.5rem 0 0}
.mast h1{font:900 2.4rem/1.05 "Playfair Display",Georgia,"Times New Roman",serif;letter-spacing:-.01em;margin:.2rem 0 .5rem}
.dbl{border:0;border-top:3px double #1a1a1a;margin:.4rem 0}
.thin{border:0;border-top:1px solid #1a1a1a;margin:.4rem 0}
.ed{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.3rem 1rem;font:600 .78rem/1.4 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;padding:.2rem 0}
.note{font:italic .85rem/1.5 Georgia,serif;color:#444;text-align:center;margin:.8rem 0 1.2rem}
.items{display:grid;grid-template-columns:1fr;gap:0}
@media (min-width:900px){.items{grid-template-columns:repeat(3,1fr)}.items article{padding:0 1.2rem;border-left:1px solid #b9b09c}.items article:first-child{border-left:0;padding-left:0}.items article:last-child{padding-right:0}}
article{padding:1rem 0 1.4rem;border-bottom:1px solid #b9b09c}
@media (min-width:900px){article{border-bottom:0}}
.kicker{font:700 .72rem/1.3 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.12em;color:#8a2b1f}
article h2{font:800 1.5rem/1.2 Georgia,"Times New Roman",serif;margin:.3rem 0 .7rem}
article p{margin:0 0 1rem}
article p:first-of-type::first-letter{float:left;font:800 3.1rem/.85 Georgia,serif;padding:.3rem .4rem 0 0}
.gl{border-top:1px solid #1a1a1a;margin-top:.6rem;padding-top:.5rem}
.gl h3{font:700 .75rem/1.3 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.12em;margin:.2rem 0 .4rem;font-variant:small-caps}
.gl ul{list-style:none;padding:0;margin:0}
.gl li{padding:.35rem 0}
.gl b{display:block}
.gl span{display:block;font:.85rem/1.4 system-ui,sans-serif;color:#555}
.src{font:.82rem/1.5 system-ui,sans-serif;color:#444;margin-top:.8rem}
.src a{color:#1f4e8a;word-break:break-word}
.arch{margin-top:2rem}
.arch h2{font:800 1.3rem/1.2 Georgia,serif;text-align:center;margin:0 0 .6rem}
details{border-bottom:1px solid #b9b09c}
summary{cursor:pointer;min-height:56px;padding:1rem .2rem;font:700 1rem/1.4 Georgia,serif;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";float:right}
details[open] summary::after{content:"－"}
summary small{display:block;font:600 .75rem/1.4 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:#666}
</style>
</head>
<body>
<main>
  <header class="mast">
    <hr class="thin">
    <h1>El Diario de Noam</h1>
    <hr class="dbl">
    <div class="ed"><span id="edate">—</span><span id="esec">Sección: —</span></div>
    <hr class="thin">
    <p class="note">Lecturas diarias en español. Nueva edición cada día alrededor de las 4 de la tarde (hora de Melbourne).</p>
  </header>
  <section id="today"><p>Cargando…</p></section>
  <section class="arch" id="archwrap" hidden><hr class="dbl"><h2>Ediciones anteriores</h2><div id="archive"></div></section>
</main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = e => e.items ? e : { ...e, items: [{ title: e.title, paragraphs: e.paragraphs, glossary: e.glossary, source: e.source }] };
const item = (it, sec) => `<article><div class="kicker">${esc(sec)}</div><h2>${esc(it.title)}</h2>`
  + (it.paragraphs||[]).map(t => `<p>${esc(t)}</p>`).join("")
  + ((it.glossary||[]).length ? `<div class="gl"><h3>Glosario</h3><ul>` + it.glossary.map(g => `<li><b>${esc(g.es)}</b><span>${esc(g.en)}</span></li>`).join("") + `</ul></div>` : "")
  + (it.source ? `<p class="src">Fuente: <a href="${esc(it.source.url)}" target="_blank" rel="noopener">${esc(it.source.name)}</a></p>` : "")
  + `</article>`;
const edition = e => `<div class="items">${e.items.map(it => item(it, e.topic)).join("")}</div>`;
fetch("posts.json?v=" + Date.now(), {cache: "no-store"}).then(r => r.json()).then(raw => {
  const eds = raw.map(norm), [cur, ...older] = eds;
  if (!cur) { document.getElementById("today").innerHTML = "<p>Todavía no hay ediciones.</p>"; return; }
  document.getElementById("edate").textContent = cur.date;
  document.getElementById("esec").textContent = "Sección: " + cur.topic;
  document.getElementById("today").innerHTML = edition(cur);
  if (older.length) {
    document.getElementById("archwrap").hidden = false;
    document.getElementById("archive").innerHTML = older.map(e =>
      `<details><summary>${esc(e.date)}<small>Sección: ${esc(e.topic)} · ${e.items.length} noticia${e.items.length > 1 ? "s" : ""}</small></summary>${edition(e)}</details>`).join("");
  }
}).catch(e => { console.error(e); document.getElementById("today").innerHTML = "<p>No se pudo cargar la edición. Intenta más tarde.</p>"; });
</script>
</body>
</html>
